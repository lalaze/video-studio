<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <style>
      /*
       * Tokens and fonts for every scene. Kept inline on purpose: the render compiler only
       * scans inline style blocks for font families, so this is where Inter and
       * JetBrains Mono must be named for it to embed them.
       */
      /* Chinese: the macOS system PingFang SC, looked up by its PostScript / full name. */
      @font-face {
        font-family: "VS PingFang";
        src: local("PingFangSC-Regular"), local("PingFang SC Regular");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "VS PingFang";
        src: local("PingFangSC-Semibold"), local("PingFang SC Semibold");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --ground: #141413;
        --panel: #1e1d1b;
        --line: #34322e;
        --ink: #f3efe6;
        --muted: #a39e93;
        --dim: #7a756c;
        --c1: #d97757; /* code animation */
        --c2: #6a9bcc; /* cut footage */
        --c3: #a98bd8; /* AI generation */
        --c4: #7db37d; /* Manim */
        --cut: #e0645a;
        /* Latin glyphs come from the bundled faces, CJK glyphs fall through to PingFang. */
        --font-sans: "Inter", "VS PingFang", sans-serif;
        --font-mono: "JetBrains Mono", "VS PingFang", monospace;
      }
      body {
        font-family: var(--font-sans);
      }
      code {
        font-family: var(--font-mono);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #141413;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* static workbench grid, 1/16 of the frame width */
        background-color: #141413;
        background-image:
          linear-gradient(rgba(243, 239, 230, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(243, 239, 230, 0.035) 1px, transparent 1px);
        background-size: 120px 120px;
        background-position: 0 0;
      }
    </style>
  </head>
  <body>
    <!--
      Nominal beats: title 0-2, four routes 2.5 s each (2-12), outro 12-15.
      Every scene host starts 0.3 s before its nominal beat so the next scene is already
      landing when the beat arrives (see ../storyboard.md).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="1.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="code"
        class="clip"
        data-composition-id="code"
        data-composition-src="compositions/code.html"
        data-start="1.7"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="cut"
        class="clip"
        data-composition-id="cut"
        data-composition-src="compositions/cut.html"
        data-start="4.2"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="gen"
        class="clip"
        data-composition-id="gen"
        data-composition-src="compositions/gen.html"
        data-start="6.7"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="manim"
        class="clip"
        data-composition-id="manim"
        data-composition-src="compositions/manim.html"
        data-start="9.2"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="11.7"
        data-duration="3.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="chrome"
        class="clip"
        data-composition-id="chrome"
        data-composition-src="compositions/chrome.html"
        data-start="1.7"
        data-duration="10"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 10"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

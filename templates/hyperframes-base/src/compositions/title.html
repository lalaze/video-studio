<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    /* exit wrapper: only the exit tween touches it */
    #title-wrap {
      position: absolute;
      inset: 0;
    }
    #title-main {
      position: absolute;
      left: 192px;
      right: 192px;
      top: 388px;
      text-align: center;
      font: 700 120px/1.15 var(--font-sans);
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    #title-rule {
      position: absolute;
      left: 760px;
      top: 548px;
      width: 400px;
      height: 8px;
      overflow: visible;
    }
    #title-rule line {
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      /* pathLength 1000, not 1: GSAP rounds px values, so 0..1 would snap on/off */
      stroke-dasharray: 1000;
    }
    #title-sub {
      position: absolute;
      left: 192px;
      right: 192px;
      top: 590px;
      text-align: center;
      font: 400 40px/1.4 var(--font-sans);
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
  <!-- Copy is a variable: the host sets it with data-variable-values, Studio can edit it. -->
  <div
    id="root"
    data-composition-id="title"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"片名写在这里"},{"id":"subtitle","type":"string","label":"Subtitle","default":"一句副标题 · subtitle"}]'
  >
    <div id="title-wrap">
      <h1 id="title-main" data-var-text="title">片名写在这里</h1>
      <svg id="title-rule" viewBox="0 0 400 8" width="400" height="8">
        <line x1="4" y1="4" x2="396" y2="4" pathLength="1000" />
      </svg>
      <p id="title-sub" data-var-text="subtitle">一句副标题 · subtitle</p>
    </div>
  </div>
  <script>
    (() => {
      // One paused timeline per scene; every tween is fromTo so seeking back is exact.
      const tl = gsap.timeline({ paused: true });

      // Frame 0 already shows the title (dim) so the thumbnail is never empty.
      tl.fromTo("#title-main", { color: "#5c5850" }, { color: "#f3efe6", duration: 0.3, ease: "power2.out" }, 0);

      tl.fromTo(
        "#title-rule line",
        { strokeDashoffset: 1000 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" },
        0.25,
      );

      tl.fromTo(
        "#title-sub",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" },
        0.5,
      );

      // Exit on the wrapper, ~0.18 s before the slot ends. A later fromTo on an element
      // that already has one needs immediateRender: false.
      tl.fromTo(
        "#title-wrap",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", immediateRender: false },
        2.33,
      );

      window.__timelines["title"] = tl;
    })();
  </script>
</template>
